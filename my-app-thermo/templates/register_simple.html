<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - ThermoCalc</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #ff6b9d;
            --secondary-color: #87ceeb;
            --dark-bg: #1a1f2e;
            --light-bg: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-primary: #1a202c;
            --text-secondary: #4a5568;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--text-primary);
            margin: 0;
            padding: 0;
        }

        .main-wrapper {
            min-height: 100vh;
            padding: 2rem 0;
        }

        .register-card {
            background: var(--card-bg);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 2.5rem;
            margin: 0 auto;
            max-width: 450px;
            border: none;
        }

        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .register-logo {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 1.8rem;
            color: white;
        }

        .register-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .register-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .form-control {
            padding: 1rem 1rem 1rem 3rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.1);
            outline: none;
        }

        .form-control.is-invalid {
            border-color: #dc3545;
        }

        .form-control.is-valid {
            border-color: #28a745;
        }

        .form-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.1rem;
            z-index: 10;
        }

        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1rem;
            z-index: 10;
        }

        .password-toggle:hover {
            color: var(--primary-color);
        }

        .btn-register {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 1rem;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
        }

        .btn-register:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 107, 157, 0.4);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .validation-message {
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }

        .validation-message.error {
            color: #dc3545;
            display: block;
        }

        .validation-message.success {
            color: #28a745;
            display: block;
        }

        .validation-message.info {
            color: var(--secondary-color);
            display: block;
        }

        .password-strength {
            display: flex;
            gap: 0.3rem;
            margin-top: 0.5rem;
        }

        .strength-bar {
            flex: 1;
            height: 3px;
            background: #e2e8f0;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .strength-bar.active.weak {
            background: #dc3545;
        }

        .strength-bar.active.medium {
            background: #ffc107;
        }

        .strength-bar.active.strong {
            background: #28a745;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            margin: 1rem 0;
        }

        .checkbox-group input[type="checkbox"] {
            margin-top: 0.2rem;
            accent-color: var(--primary-color);
        }

        .checkbox-group label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .checkbox-group a {
            color: var(--secondary-color);
            text-decoration: none;
        }

        .checkbox-group a:hover {
            color: var(--primary-color);
        }

        .register-links {
            text-align: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #e2e8f0;
        }

        .register-links p {
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .register-links a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .register-links a:hover {
            color: var(--primary-color);
        }

        .alert {
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border: none;
        }

        .alert-danger {
            background: rgba(220, 53, 69, 0.1);
            color: #dc3545;
            border: 1px solid rgba(220, 53, 69, 0.3);
        }

        .alert-success {
            background: rgba(40, 167, 69, 0.1);
            color: #28a745;
            border: 1px solid rgba(40, 167, 69, 0.3);
        }

        .back-home {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-home:hover {
            color: var(--primary-color);
            transform: translateX(-5px);
        }

        @media (max-width: 768px) {
            .main-wrapper {
                padding: 1rem 0;
            }
            
            .register-card {
                margin: 1rem;
                padding: 1.5rem;
            }
            
            .back-home {
                position: static;
                margin-bottom: 1rem;
                justify-content: center;
                color: var(--text-primary);
            }
            
            body {
                background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <!-- Back to Home -->
        <a href="/" class="back-home">
            <i class="fas fa-arrow-left"></i>
            Accueil
        </a>

        <!-- Register Container -->
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-7">
                    <div class="register-card">
                        <!-- Register Header -->
                        <div class="register-header">
                            <div class="register-logo">
                                <i class="fas fa-user-plus"></i>
                            </div>
                            <h1 class="register-title">Inscription</h1>
                            <p class="register-subtitle">Créez votre espace de calcul</p>
                        </div>

                        <!-- Register Form -->
                        <form id="registerForm" method="POST" autocomplete="off">
                            {% if error %}
                                <div class="alert alert-danger">
                                    <i class="fas fa-exclamation-triangle me-2"></i>{{ error|safe }}
                                </div>
                            {% endif %}

                            {% if success %}
                                <div class="alert alert-success">
                                    <i class="fas fa-check-circle me-2"></i>{{ success }}
                                </div>
                            {% endif %}

                            <div class="form-group">
                                <i class="fas fa-user form-icon"></i>
                                <input type="text" 
                                       class="form-control" 
                                       id="username" 
                                       name="username" 
                                       placeholder="Nom d'utilisateur" 
                                       autocomplete="off"
                                       required
                                       minlength="3"
                                       maxlength="20">
                                <div class="validation-message" id="usernameMessage"></div>
                            </div>

                            <div class="form-group">
                                <i class="fas fa-envelope form-icon"></i>
                                <input type="email" 
                                       class="form-control" 
                                       id="email" 
                                       name="email" 
                                       placeholder="Adresse email" 
                                       autocomplete="off"
                                       required>
                                <div class="validation-message" id="emailMessage"></div>
                            </div>

                            <div class="form-group">
                                <i class="fas fa-lock form-icon"></i>
                                <input type="password" 
                                       class="form-control" 
                                       id="password" 
                                       name="password" 
                                       placeholder="Mot de passe" 
                                       autocomplete="new-password"
                                       required
                                       minlength="8">
                                <button type="button" class="password-toggle" id="togglePassword">
                                    <i class="fas fa-eye" id="eyeIcon"></i>
                                </button>
                                <div class="password-strength" id="passwordStrength">
                                    <div class="strength-bar"></div>
                                    <div class="strength-bar"></div>
                                    <div class="strength-bar"></div>
                                    <div class="strength-bar"></div>
                                </div>
                                <div class="validation-message" id="passwordMessage"></div>
                            </div>

                            <div class="form-group">
                                <i class="fas fa-lock form-icon"></i>
                                <input type="password" 
                                       class="form-control" 
                                       id="confirmPassword" 
                                       name="confirmPassword" 
                                       placeholder="Confirmer le mot de passe" 
                                       autocomplete="new-password"
                                       required>
                                <button type="button" class="password-toggle" id="toggleConfirmPassword">
                                    <i class="fas fa-eye" id="eyeIconConfirm"></i>
                                </button>
                                <div class="validation-message" id="confirmPasswordMessage"></div>
                            </div>

                            <!-- Terms and Conditions -->
                            <div class="checkbox-group">
                                <input type="checkbox" id="terms" name="terms" required>
                                <label for="terms">
                                    J'accepte les <a href="/terms" target="_blank">conditions d'utilisation</a> 
                                    et la <a href="/privacy" target="_blank">politique de confidentialité</a>
                                </label>
                            </div>

                            <button type="submit" class="btn-register" id="submitBtn">
                                <i class="fas fa-user-plus me-2"></i>
                                Créer mon compte
                            </button>
                        </form>

                        <!-- Links -->
                        <div class="register-links">
                            <p>Déjà inscrit ?</p>
                            <a href="/login">Se connecter</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Form Validation
        const form = document.getElementById('registerForm');
        const username = document.getElementById('username');
        const email = document.getElementById('email');
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirmPassword');
        const terms = document.getElementById('terms');
        const submitBtn = document.getElementById('submitBtn');

        // Password Toggle
        const togglePassword = document.getElementById('togglePassword');
        const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeIconConfirm = document.getElementById('eyeIconConfirm');

        togglePassword.addEventListener('click', function() {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            eyeIcon.className = type === 'text' ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        toggleConfirmPassword.addEventListener('click', function() {
            const type = confirmPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            confirmPassword.setAttribute('type', type);
            eyeIconConfirm.className = type === 'text' ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        // Username Validation
        username.addEventListener('input', function() {
            const value = this.value.trim();
            const message = document.getElementById('usernameMessage');
            
            if (value.length < 3) {
                this.classList.add('is-invalid');
                this.classList.remove('is-valid');
                message.className = 'validation-message error';
                message.textContent = 'Le nom d\'utilisateur doit contenir au moins 3 caractères';
            } else if (!/^[a-zA-Z0-9_]+$/.test(value)) {
                this.classList.add('is-invalid');
                this.classList.remove('is-valid');
                message.className = 'validation-message error';
                message.textContent = 'Uniquement lettres, chiffres et underscore';
            } else {
                this.classList.remove('is-invalid');
                this.classList.add('is-valid');
                message.className = 'validation-message success';
                message.textContent = 'Nom d\'utilisateur valide';
            }
        });

        // Email Validation
        email.addEventListener('input', function() {
            const value = this.value.trim();
            const message = document.getElementById('emailMessage');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (!emailRegex.test(value)) {
                this.classList.add('is-invalid');
                this.classList.remove('is-valid');
                message.className = 'validation-message error';
                message.textContent = 'Veuillez entrer une adresse email valide';
            } else {
                this.classList.remove('is-invalid');
                this.classList.add('is-valid');
                message.className = 'validation-message success';
                message.textContent = 'Email valide';
            }
        });

        // Password Validation
        password.addEventListener('input', function() {
            const value = this.value;
            const message = document.getElementById('passwordMessage');
            const strengthBars = document.querySelectorAll('.strength-bar');
            
            // Reset strength bars
            strengthBars.forEach(bar => bar.className = 'strength-bar');
            
            if (value.length < 8) {
                this.classList.add('is-invalid');
                this.classList.remove('is-valid');
                message.className = 'validation-message error';
                message.textContent = 'Le mot de passe doit contenir au moins 8 caractères';
            } else {
                let strength = 0;
                if (value.length >= 8) strength++;
                if (value.length >= 12) strength++;
                if (/[a-z]/.test(value) && /[A-Z]/.test(value)) strength++;
                if (/[0-9]/.test(value)) strength++;
                if (/[^a-zA-Z0-9]/.test(value)) strength++;
                
                if (strength <= 2) {
                    this.classList.add('is-invalid');
                    this.classList.remove('is-valid');
                    message.className = 'validation-message error';
                    message.textContent = 'Mot de passe faible';
                    for (let i = 0; i < 1; i++) {
                        strengthBars[i].classList.add('active', 'weak');
                    }
                } else if (strength <= 3) {
                    this.classList.remove('is-invalid', 'is-valid');
                    message.className = 'validation-message info';
                    message.textContent = 'Mot de passe moyen';
                    for (let i = 0; i < 2; i++) {
                        strengthBars[i].classList.add('active', 'medium');
                    }
                } else {
                    this.classList.remove('is-invalid');
                    this.classList.add('is-valid');
                    message.className = 'validation-message success';
                    message.textContent = 'Mot de passe fort';
                    for (let i = 0; i < 4; i++) {
                        strengthBars[i].classList.add('active', 'strong');
                    }
                }
            }
            
            // Check confirmation if already filled
            if (confirmPassword.value) {
                confirmPassword.dispatchEvent(new Event('input'));
            }
        });

        // Confirm Password Validation
        confirmPassword.addEventListener('input', function() {
            const value = this.value;
            const message = document.getElementById('confirmPasswordMessage');
            
            if (value !== password.value) {
                this.classList.add('is-invalid');
                this.classList.remove('is-valid');
                message.className = 'validation-message error';
                message.textContent = 'Les mots de passe ne correspondent pas';
            } else if (value.length > 0) {
                this.classList.remove('is-invalid');
                this.classList.add('is-valid');
                message.className = 'validation-message success';
                message.textContent = 'Les mots de passe correspondent';
            }
        });

        // Form Submit Validation
        form.addEventListener('submit', function(e) {
            let isValid = true;
            
            // Check all fields
            if (username.classList.contains('is-invalid') || !username.value.trim()) {
                isValid = false;
                username.classList.add('is-invalid');
            }
            
            if (email.classList.contains('is-invalid') || !email.value.trim()) {
                isValid = false;
                email.classList.add('is-invalid');
            }
            
            if (password.classList.contains('is-invalid') || !password.value.trim()) {
                isValid = false;
                password.classList.add('is-invalid');
            }
            
            if (confirmPassword.classList.contains('is-invalid') || !confirmPassword.value.trim()) {
                isValid = false;
                confirmPassword.classList.add('is-invalid');
            }
            
            if (!terms.checked) {
                isValid = false;
                alert('Veuillez accepter les conditions d\'utilisation');
            }
            
            if (!isValid) {
                e.preventDefault();
            } else {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Création en cours...';
            }
        });

        // Focus on first field
        username.focus();
    </script>
</body>
</html>
