<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - ThermoCalc</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-dark: #1a1f2e;
            --secondary-dark: #2d3748;
            --accent-rose: #ff6b9d;
            --accent-sky: #87ceeb;
            --accent-purple: #9f7aea;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        /* Thème clair */
        [data-theme="light"] {
            --primary-dark: #f8fafc;
            --secondary-dark: #e2e8f0;
            --accent-rose: #ff6b9d;
            --accent-sky: #0ea5e9;
            --accent-purple: #8b5cf6;
            --text-primary: #1a202c;
            --text-secondary: #4a5568;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary-dark);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            background: linear-gradient(45deg, var(--accent-rose), var(--accent-sky), var(--accent-purple));
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg-animation::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--primary-dark);
            opacity: 0.9;
        }

        /* Navigation Buttons */
        .nav-buttons {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }

        .back-btn {
            width: auto;
            min-width: 120px;
            height: 50px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: var(--text-primary);
            text-decoration: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            padding: 0 1rem;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .back-btn:hover {
            background: var(--accent-sky);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(135, 206, 235, 0.3);
        }

        /* Theme Switch */
        .theme-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            width: 60px;
            height: 30px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0 5px;
            transition: all 0.3s ease;
        }

        .theme-switch .slider {
            width: 20px;
            height: 20px;
            background: var(--accent-sky);
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-switch.active .slider {
            transform: translateX(30px);
            background: var(--accent-rose);
        }

        /* Register Container */
        .register-container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            z-index: 10;
            position: relative;
        }

        .register-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .register-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-rose), var(--accent-sky), var(--accent-purple));
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Register Header */
        .register-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .register-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent-sky), var(--accent-purple));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 1.5rem;
            color: white;
            box-shadow: 0 10px 25px rgba(135, 206, 235, 0.3);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .register-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--accent-sky), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .register-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Form Styles */
        .register-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent-sky);
            box-shadow: 0 0 0 3px rgba(135, 206, 235, 0.1);
            transform: translateY(-2px);
        }

        .form-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        .form-input:focus + .form-icon {
            color: var(--accent-sky);
        }

        /* Password Requirements */
        .password-requirements {
            margin-top: 0.5rem;
            padding: 0.75rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            font-size: 0.8rem;
        }

        .password-requirements ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .password-requirements li {
            color: var(--text-secondary);
            margin-bottom: 0.25rem;
            transition: color 0.3s ease;
        }

        .password-requirements li.valid {
            color: var(--accent-sky);
        }

        /* Alerts */
        .alert {
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert.error {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.2);
            color: #f87171;
        }

        .alert.success {
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }

        /* Button */
        .btn-register {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--accent-sky), var(--accent-purple));
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(135, 206, 235, 0.3);
        }

        .btn-register:active {
            transform: translateY(0);
        }

        .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Links */
        .register-links {
            text-align: center;
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--glass-border);
        }

        .register-links p {
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .register-links a {
            color: var(--accent-rose);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .register-links a:hover {
            color: var(--accent-sky);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .register-container {
                padding: 1rem;
                margin: 1rem;
            }
            
            .register-card {
                padding: 1.5rem;
            }
            
            .register-title {
                font-size: 1.5rem;
            }
            
            .nav-buttons {
                top: 10px;
                left: 10px;
            }
            
            .back-btn {
                width: auto;
                min-width: 100px;
                height: 40px;
                font-size: 0.8rem;
                padding: 0 0.75rem;
            }
            
            .theme-switch {
                top: 10px;
                right: 10px;
                width: 50px;
                height: 25px;
            }
            
            .form-input {
                padding: 0.75rem 0.75rem 0.75rem 2.5rem;
            }
            
            .btn-register {
                padding: 0.75rem 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 0.5rem;
            }
            
            .register-card {
                padding: 1rem;
            }
            
            .register-title {
                font-size: 1.25rem;
            }
            
            .register-subtitle {
                font-size: 0.875rem;
            }
            
            .form-group {
                margin-bottom: 1rem;
            }
            
            .password-requirements {
                font-size: 0.7rem;
                padding: 0.5rem;
            }
            
            .btn-register {
                padding: 0.625rem 1rem;
                font-size: 0.875rem;
            }
        }
    </style>
</head>
<body data-theme="dark">
    <!-- Animated Background -->
    <div class="bg-animation"></div>
    
    <!-- Navigation Buttons -->
    <div class="nav-buttons">
        <a href="/" class="back-btn" title="Retour à l'accueil">
            <i class="fas fa-home"></i>
            Accueil
        </a>
    </div>
    
    <!-- Theme Switch -->
    <div class="theme-switch" id="themeSwitch">
        <div class="slider">
            <i class="fas fa-moon" id="sliderIcon"></i>
        </div>
    </div>
    <i class="fas fa-sun theme-icon" id="sunIcon"></i>

    <!-- Register Container -->
    <div class="register-container">
        <div class="register-card">
            <!-- Register Header -->
            <div class="register-header">
                <div class="register-logo">
                    <i class="fas fa-user-plus"></i>
                </div>
                <h1 class="register-title">Inscription</h1>
                <p class="register-subtitle">Créez votre compte pour accéder aux calculs</p>
            </div>

            <!-- Register Form -->
            <form class="register-form" method="POST" id="registerForm" autocomplete="off">
                {% if error %}
                    <div class="alert error">
                        <i class="fas fa-exclamation-triangle me-2"></i>{{ error }}
                    </div>
                {% endif %}

                {% if success %}
                    <div class="alert success">
                        <i class="fas fa-check-circle me-2"></i>{{ success }}
                    </div>
                {% endif %}

                <div class="form-group">
                    <label class="form-label">Nom d'utilisateur</label>
                    <input type="text" 
                           class="form-input" 
                           id="username" 
                           name="username" 
                           placeholder="Choisissez un nom d'utilisateur" 
                           autocomplete="off"
                           required
                           minlength="3"
                           maxlength="20">
                    <i class="fas fa-user form-icon"></i>
                </div>

                <div class="form-group">
                    <label class="form-label">Adresse email</label>
                    <input type="email" 
                           class="form-input" 
                           id="email" 
                           name="email" 
                           placeholder="votre.email@exemple.com" 
                           autocomplete="off"
                           required>
                    <i class="fas fa-envelope form-icon"></i>
                </div>

                <div class="form-group">
                    <label class="form-label">Mot de passe</label>
                    <input type="password" 
                           class="form-input" 
                           id="password" 
                           name="password" 
                           placeholder="Choisissez un mot de passe sécurisé" 
                           autocomplete="new-password"
                           required
                           minlength="6">
                    <i class="fas fa-lock form-icon"></i>
                    <div class="password-requirements">
                        <ul>
                            <li id="length">Au moins 6 caractères</li>
                            <li id="uppercase">Au moins une majuscule</li>
                            <li id="lowercase">Au moins une minuscule</li>
                            <li id="number">Au moins un chiffre</li>
                        </ul>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Confirmer le mot de passe</label>
                    <input type="password" 
                           class="form-input" 
                           id="confirm_password" 
                           name="confirm_password" 
                           placeholder="Confirmez votre mot de passe" 
                           autocomplete="new-password"
                           required>
                    <i class="fas fa-lock form-icon"></i>
                </div>

                <button type="submit" class="btn-register" id="submitBtn">
                    <i class="fas fa-user-plus"></i>
                    S'inscrire
                </button>
            </form>

            <!-- Links -->
            <div class="register-links">
                <p>Déjà un compte ?</p>
                <a href="/login">Se connecter</a>
            </div>
        </div>
    </div>

    <script>
        // Password validation
        const password = document.getElementById('password');
        const confirmPassword = document.getElementById('confirm_password');
        const lengthReq = document.getElementById('length');
        const uppercaseReq = document.getElementById('uppercase');
        const lowercaseReq = document.getElementById('lowercase');
        const numberReq = document.getElementById('number');

        function validatePassword() {
            const value = password.value;
            
            // Length
            if (value.length >= 6) {
                lengthReq.classList.add('valid');
            } else {
                lengthReq.classList.remove('valid');
            }
            
            // Uppercase
            if (/[A-Z]/.test(value)) {
                uppercaseReq.classList.add('valid');
            } else {
                uppercaseReq.classList.remove('valid');
            }
            
            // Lowercase
            if (/[a-z]/.test(value)) {
                lowercaseReq.classList.add('valid');
            } else {
                lowercaseReq.classList.remove('valid');
            }
            
            // Number
            if (/\d/.test(value)) {
                numberReq.classList.add('valid');
            } else {
                numberReq.classList.remove('valid');
            }
        }

        function validatePasswordMatch() {
            if (confirmPassword.value && password.value !== confirmPassword.value) {
                confirmPassword.setCustomValidity('Les mots de passe ne correspondent pas');
            } else {
                confirmPassword.setCustomValidity('');
            }
        }

        // Event listeners
        password.addEventListener('input', validatePassword);
        confirmPassword.addEventListener('input', validatePasswordMatch);

        // Form validation
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const passwordValue = password.value;
            const confirmValue = confirmPassword.value;
            
            if (passwordValue.length < 6 || !/[A-Z]/.test(passwordValue) || 
                !/[a-z]/.test(passwordValue) || !/\d/.test(passwordValue)) {
                e.preventDefault();
                alert('Le mot de passe doit respecter toutes les exigences de sécurité');
                return false;
            }
            
            if (passwordValue !== confirmValue) {
                e.preventDefault();
                alert('Les mots de passe ne correspondent pas');
                return false;
            }
        });

        // Username validation
        document.getElementById('username').addEventListener('input', function() {
            const username = this.value;
            const usernameRegex = /^[a-zA-Z0-9_]{3,20}$/;
            
            if (!usernameRegex.test(username) && username.length > 0) {
                this.setCustomValidity('Le nom d\'utilisateur doit contenir 3-20 caractères (lettres, chiffres, underscore)');
            } else {
                this.setCustomValidity('');
            }
        });

        // Theme Management
        const themeSwitch = document.getElementById('themeSwitch');
        const themeIcon = document.getElementById('themeIcon');
        const sliderIcon = document.getElementById('sliderIcon');
        const sunIcon = document.getElementById('sunIcon');
        
        // Load saved theme or default to dark
        const savedTheme = localStorage.getItem('theme') || 'dark';
        setTheme(savedTheme);
        
        // Theme switch event listener
        themeSwitch.addEventListener('click', function() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
            localStorage.setItem('theme', newTheme);
        });
        
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            
            if (theme === 'light') {
                themeSwitch.classList.add('active');
                themeIcon.className = 'fas fa-sun theme-icon';
                sliderIcon.className = 'fas fa-sun';
                sunIcon.style.color = 'var(--accent-sky)';
                themeIcon.style.color = 'var(--accent-sky)';
            } else {
                themeSwitch.classList.remove('active');
                themeIcon.className = 'fas fa-moon theme-icon';
                sliderIcon.className = 'fas fa-moon';
                sunIcon.style.color = 'var(--text-secondary)';
                themeIcon.style.color = 'var(--text-secondary)';
            }
        }
        
        // Initialize
        validatePassword();
        validatePasswordMatch();
    </script>
</body>
</html>
