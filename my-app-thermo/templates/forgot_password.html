<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mot de passe oublié - ThermoCalc</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-dark: #1a1f2e;
            --secondary-dark: #2d3748;
            --accent-rose: #ff6b9d;
            --accent-sky: #87ceeb;
            --accent-purple: #9f7aea;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        /* Thème clair */
        [data-theme="light"] {
            --primary-dark: #f8fafc;
            --secondary-dark: #e2e8f0;
            --accent-rose: #ff6b9d;
            --accent-sky: #0ea5e9;
            --accent-purple: #8b5cf6;
            --text-primary: #1a202c;
            --text-secondary: #4a5568;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--secondary-dark) 30%, var(--accent-sky) 70%, var(--accent-purple) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: linear-gradient(270deg, var(--primary-dark), var(--secondary-dark), var(--accent-sky), var(--accent-purple), var(--accent-sky));
            background-size: 800% 800%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Navigation */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 1rem 2rem;
            z-index: 1000;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent-rose), var(--accent-purple));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        /* Forgot Password Container */
        .forgot-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .forgot-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .forgot-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-rose), var(--accent-purple), var(--accent-sky));
        }

        .forgot-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .forgot-logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent-sky), var(--accent-purple));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 1.5rem;
            color: white;
        }

        .forgot-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--text-primary), var(--accent-sky));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .forgot-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Form Styles */
        .forgot-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            position: relative;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-sky);
            box-shadow: 0 0 0 3px rgba(135, 206, 235, 0.1);
        }

        .form-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent-sky), var(--accent-purple));
            border: none;
            color: white;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(135, 206, 235, 0.4);
        }

        .btn-back {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-back:hover {
            border-color: var(--accent-sky);
            color: var(--accent-sky);
        }

        /* Alert */
        .alert {
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .forgot-container {
                padding: 1rem;
            }
            
            .forgot-card {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">
                <div class="logo-icon">
                    <i class="fas fa-flask"></i>
                </div>
                <span>ThermoCalc</span>
            </a>
        </div>
    </nav>

    <!-- Forgot Password Container -->
    <div class="forgot-container">
        <div class="forgot-card">
            <!-- Forgot Password Header -->
            <div class="forgot-header">
                <div class="forgot-logo">
                    <i class="fas fa-key"></i>
                </div>
                <h1 class="forgot-title">Mot de passe oublié</h1>
                <p class="forgot-subtitle">Entrez votre email pour recevoir votre mot de passe</p>
            </div>

            <!-- Forgot Password Form -->
            <form class="forgot-form" method="POST">
                {% if error %}
                    <div class="alert alert-error">
                        <i class="fas fa-exclamation-triangle"></i>
                        {{ error }}
                    </div>
                {% endif %}

                {% if success %}
                    <div class="alert alert-success">
                        <i class="fas fa-check-circle"></i>
                        {{ success }}
                    </div>
                {% endif %}

                <div class="form-group">
                    <label class="form-label">Adresse email</label>
                    <input type="email" 
                           class="form-input" 
                           id="email" 
                           name="email" 
                           placeholder="votre.email@exemple.com" 
                           autocomplete="off"
                           required>
                    <i class="fas fa-envelope form-icon"></i>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-paper-plane"></i>
                    Envoyer le mot de passe
                </button>
            </form>

            <!-- Back to Login -->
            <div style="text-align: center; margin-top: 2rem;">
                <a href="/login" class="btn-back">
                    <i class="fas fa-arrow-left"></i>
                    Retour à la connexion
                </a>
            </div>
        </div>
    </div>

    <!-- Theme Switcher -->
    <script>
        const themeSwitch = document.createElement('div');
        themeSwitch.innerHTML = `
            <div class="theme-switcher" style="position: fixed; top: 80px; right: 20px; display: flex; align-items: center; gap: 0.5rem;">
                <i class="fas fa-moon theme-icon" id="themeIcon"></i>
                <div class="theme-switch" id="themeSwitch" style="position: relative; width: 60px; height: 30px; background: var(--glass-border); border-radius: 15px; cursor: pointer; border: 2px solid var(--glass-border);">
                    <div class="theme-slider" id="sliderIcon" style="position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: var(--accent-rose); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px;">
                        <i class="fas fa-moon" style="font-size: 12px;"></i>
                    </div>
                </div>
                <i class="fas fa-sun theme-icon" id="sunIcon"></i>
            </div>
        `;
        document.body.appendChild(themeSwitch);

        // Theme Management
        const savedTheme = localStorage.getItem('theme') || 'dark';
        setTheme(savedTheme);
        
        themeSwitch.querySelector('#themeSwitch').addEventListener('click', function() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
            localStorage.setItem('theme', newTheme);
        });
        
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            
            if (theme === 'light') {
                themeSwitch.querySelector('#themeSwitch').classList.add('active');
                themeSwitch.querySelector('#themeIcon').className = 'fas fa-sun theme-icon';
                themeSwitch.querySelector('#sliderIcon').innerHTML = '<i class="fas fa-sun" style="font-size: 12px;"></i>';
                themeSwitch.querySelector('#sliderIcon').style.background = 'var(--accent-sky)';
            } else {
                themeSwitch.querySelector('#themeSwitch').classList.remove('active');
                themeSwitch.querySelector('#themeIcon').className = 'fas fa-moon theme-icon';
                themeSwitch.querySelector('#sliderIcon').innerHTML = '<i class="fas fa-moon" style="font-size: 12px;"></i>';
                themeSwitch.querySelector('#sliderIcon').style.background = 'var(--accent-rose)';
            }
        }
    </script>
</body>
</html>
