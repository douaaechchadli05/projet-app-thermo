{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Créer un Compte</h2>
        {% if error %}
            <div class="error-bar" style="display: block;">{{ error }}</div>
        {% endif %}
        {% if message %}
            <div class="success-bar" style="display: block;">{{ message }}</div>
            {% if verification_link %}
                <div style="margin-top: 1rem; word-break: break-all; font-size: 0.9rem; color: #333;">
                    Lien de vérification : <a href="{{ verification_link }}">{{ verification_link }}</a>
                </div>
            {% endif %}
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" name="username" required placeholder="Choisissez votre identifiant">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Votre email professionnel">
            </div>
            <div class="form-group">
                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required placeholder="Sécurisez votre compte">
            </div>
            <button type="submit" class="btn-primary">S'inscrire</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem;">
            Déjà inscrit ? <a href="/login">Se connecter ici</a>
        </p>
    </div>
</div>
{% endblock %}
