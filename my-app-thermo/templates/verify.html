{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="auth-card" style="max-width: 560px; margin: 2rem auto;">
        <h2>Vérification email</h2>
        {% if message %}
            <div class="success-bar" style="display: block;">{{ message }}</div>
        {% elif error %}
            <div class="error-bar" style="display: block;">{{ error }}</div>
        {% endif %}
        <p style="margin-top: 1rem;">Vous pouvez maintenant retourner à la <a href="/login">page de connexion</a>.</p>
    </div>
</div>
{% endblock %}
